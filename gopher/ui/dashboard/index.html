<!doctype html>
<html><head><meta charset="utf-8"><title>Gopher</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--card:#f5f5f7}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f5f5f7;--mut:#98989d;--line:#38383a;--card:#2c2c2e}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 16px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}
h1{font-size:20px;margin:0 0 16px}
.status{display:flex;align-items:center;gap:10px;font-size:16px}
.dot{width:12px;height:12px;border-radius:50%;background:#8e8e93}
.dot.on{background:#30d158}.dot.busy{background:#ffd60a}.dot.err{background:#ff453a}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
input[type=text],input[type=number],textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);
border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:13px}
.row{display:flex;gap:12px}.row>div{flex:1}
button{padding:8px 16px;border:0;border-radius:8px;background:#0a84ff;color:#fff;font:inherit;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:16px}
#msg{color:var(--mut);margin-left:8px;align-self:center}
</style></head><body><main>
<h1>Gopher 🐹</h1>
<div class="card"><div class="status"><span id="dot" class="dot"></span><span id="status">…</span></div>
<div class="actions"><button id="toggle">Connect</button><span id="tmsg" style="color:var(--mut);align-self:center"></span></div></div>
<div class="card"><form id="f">
<label>SSH host</label><input type="text" name="ssh_host">
<label>SSH user</label><input type="text" name="ssh_user">
<div class="row"><div><label>SSH port</label><input type="number" name="ssh_port"></div>
<div><label>Local SOCKS port</label><input type="number" name="local_port"></div></div>
<label>Domains routed through the proxy (one per line)</label><textarea name="domains"></textarea>
<label><input type="checkbox" name="auto_reconnect"> Auto reconnect</label>
<div class="actions"><button type="submit">Save</button><span id="msg"></span></div>
</form></div>
<script>
const T=new URLSearchParams(location.search).get("t");
const api=(p,b)=>fetch(p,{method:b?"POST":"GET",headers:{"X-Token":T,"Content-Type":"application/json"},
body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const f=document.getElementById("f"),msg=document.getElementById("msg"),tmsg=document.getElementById("tmsg");
let loaded=false;
async function refresh(){
  const s=await api("/api/state");
  document.getElementById("dot").className="dot "+s.level;
  document.getElementById("status").textContent=s.status;
  document.getElementById("toggle").textContent=s.connected?"Disconnect":"Connect";
  if(!loaded){loaded=true;for(const [k,v] of Object.entries(s.config)){
    const el=f.elements[k];if(!el)continue;
    if(el.type==="checkbox")el.checked=v;
    else el.value=Array.isArray(v)?v.join("\n"):v;}}
}
document.getElementById("toggle").onclick=async()=>{
  const r=await api("/api/toggle",{});tmsg.textContent=r.error||"";refresh();};
f.onsubmit=async e=>{e.preventDefault();
  const b={};for(const el of f.elements){if(!el.name)continue;
    b[el.name]=el.type==="checkbox"?el.checked:el.type==="number"?+el.value
      :el.name==="domains"?el.value.split("\n"):el.value.trim();}
  const r=await api("/api/config",b);msg.textContent=r.error||"Saved";refresh();};
refresh();setInterval(refresh,2000);
</script></main></body></html>
