[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gopher"
version = "0.1.0"
description = "macOS menubar app that routes Discord through an SSH SOCKS5 tunnel"
requires-python = ">=3.11"
dependencies = ["rumps"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
gopher = "gopher.__main__:main"

[tool.setuptools.packages.find]
include = ["gopher*"]

[tool.setuptools.package-data]
"gopher.ui.dashboard" = ["index.html"]
